[project]
name = "sqpulse"
version = "0.1.0"
description = "Quantum pulse engineering, Transmon dynamics simulation, and calibration experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "qutip>=5.0",
    "lmfit>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqpulse"]
